name: GalaxyApp
options:
  bundleIdPrefix: com.kellyredding
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

packages:
  Galactic:
    url: https://github.com/kellyredding/Galactic.git
    exactVersion: 0.5.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.5.0

targets:
  GalaxyApp:
    type: application
    platform: macOS
    sources:
      - GalaxyApp
    info:
      path: GalaxyApp/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Galaxy
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.kellyredding.galaxy
            CFBundleURLSchemes:
              - galaxy
    settings:
      base:
        PRODUCT_NAME: Galaxy
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyredding.Galaxy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Galactic
        product: Galactic
      - package: Markdown
        product: Markdown

  # Galaxy's only test surface. A standalone tool that links the
  # Foundation-only keystroke model and asserts against it — no app, no
  # AppKit, no WebView. Mirrors assist-ant's ItemsSmoke.
  #
  # Listing sources file-by-file rather than by directory is deliberate: it
  # fails to compile the moment one of them grows an AppKit dependency, which
  # is the property that keeps the matcher testable.
  KeystrokeSmoke:
    type: tool
    platform: macOS
    sources:
      - GalaxyApp/Models/Keystroke.swift
      - GalaxyApp/Models/TextEntryBindings.swift
      - GalaxyApp/Models/ClaudeKeybindingsWriter.swift
      # Foundation-only, and the writer logs through it.
      - GalaxyApp/Models/GalaxyLog.swift
      - KeystrokeSmoke
    settings:
      base:
        SWIFT_VERSION: "5.10"
