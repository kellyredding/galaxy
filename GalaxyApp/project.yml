name: GalaxyApp
options:
  bundleIdPrefix: com.kellyredding
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.2"

packages:
  Galactic:
    url: https://github.com/kellyredding/Galactic.git
    exactVersion: 0.6.0
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.5.0

targets:
  GalaxyApp:
    type: application
    platform: macOS
    sources:
      - GalaxyApp
    info:
      path: GalaxyApp/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Galaxy
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.kellyredding.galaxy
            CFBundleURLSchemes:
              - galaxy
    settings:
      base:
        PRODUCT_NAME: Galaxy
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyredding.Galaxy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Galactic
        product: Galactic
      - package: Markdown
        product: Markdown

  # Galaxy's only test surface. A standalone tool that links the
  # Foundation-only keystroke catalog and asserts against it — no app, no
  # AppKit of its own, no WebView, no window. Mirrors assist-ant's ItemsSmoke.
  #
  # Listing sources file-by-file rather than by directory is deliberate: the
  # target compiles exactly these five files, so a catalog that grew a
  # dependency on app state — SettingsManager, a coordinator, a view — fails
  # to link here rather than quietly moving the sheet's decisions somewhere
  # nothing can assert them. `Models/Keystrokes/` stays `import Foundation`
  # only, and that is what this list enforces.
  #
  # The gates are the reason this exists — they restate what MainMenu decides,
  # and nothing else can tell you when the two have drifted.
  KeystrokeSmoke:
    type: tool
    platform: macOS
    sources:
      - GalaxyApp/Models/Keystrokes/KeystrokeEntry.swift
      - GalaxyApp/Models/Keystrokes/KeystrokeContext.swift
      - GalaxyApp/Models/Keystrokes/KeystrokeCatalog.swift
      # The two enums the context and every tab-shaped gate are written
      # in terms of. Foundation-only: their SF Symbol names are plain
      # strings, not Image initializers.
      - GalaxyApp/Models/SessionTab.swift
      - GalaxyApp/Models/LedgerSubTab.swift
      - KeystrokeSmoke
    dependencies:
      # CheatSheetSearch, CheatSheetGlyphs and FuzzyMatch live in Galactic,
      # and the concept checks assert the real catalog *through* them:
      # "stop the session" reaching the ⌘W row and "backspace" reaching the
      # two ⌫ rows are facts about the authored aliases, and only the shared
      # matcher can decide them. Galaxy's labels are terse menu titles, so
      # aliases carry more weight here than in assist-ant — a tier that
      # cannot test them is the wrong trade. Compiling a second copy of the
      # matcher to avoid the dependency is the duplication the extraction
      # removed.
      - package: Galactic
        product: Galactic
    settings:
      base:
        SWIFT_VERSION: "5.10"
